# Fork build: publishes an image of THIS fork to GitHub Container Registry
# (ghcr.io) so it can be self-hosted (e.g. on a Synology NAS).
# Trigger manually: Actions tab -> "Development Watcharr Image Release" -> Run workflow
# (select this branch). Adapted from upstream: pushes only to ghcr under this
# account, no Docker Hub. Single-arch (linux/amd64) since Synology Container
# Manager is x86_64.

name: Development Watcharr Image Release

on:
  workflow_dispatch:

env:
  image: fjacques-2025/watcharr

jobs:
  release-dev-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.image }}:dev
            ghcr.io/${{ env.image }}:${{ github.sha }}
